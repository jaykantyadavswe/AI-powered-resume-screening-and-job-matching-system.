[project]
name = "resume-evaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jaykantyadavswe", email = "jaykant.yadav.cse@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docx>=0.2.4",
    "groq>=1.7.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
resume-evaluator = "resume_evaluator:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "venv",
]
